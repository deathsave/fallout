#config_version=6

virtual_platform_start_active_switches:
    #- s
    _trough1
    #- s_trough2
    #- s_trough3
keyboard:
    s:
        switch: s_start
    k:
        switch: s_left_flipper
    l:
        switch: s_right_flipper

hardware:
    platform: fast

fast:
  net:
    controller: neuron
    io_loop:
      3208:
        model: FP-I/O-3208
        order: 1
      "0804":
        model: FP-I/O-0804
        order: 2
    port: auto
    baud: 921600
    debug: false
    watchdog: 1s
    default_quick_debounce_open: 2ms
    default_quick_debounce_close: 2ms
    default_normal_debounce_open: 4ms
    default_normal_debounce_close: 4ms
  exp:
    boards:
      neuron:
        model: FP-EXP-2000
      playfield:
        model: FP-EXP-0081
    port: /dev/ttyACM1
    baud: 921600
    debug: false

kivy_config:
    kivy:
        desktop: 1
        exit_on_escape: true
        pause_on_minimize: 0
    graphics:
        borderless: true
        window_state: visible # visible, hidden, maximized, minimized
        fbo: software # hardware, software, force-hardware
        fullscreen: false
        left: 0
        top: 0
        width: 2646  # width of display1 + display2
        height: 768  # common height (or the maximum of both)
        maxfps: 30
        multisamples: 2
        position: custom # auto, custom
        show_cursor: true
        resizable: false
        rotation: 0
displays:
    display1:
      width: 1366
      height: 768
      default: true
    display2:
      width: 1280
      height: 720
    combined_display:
      width: 2646
      height: 768

slides:
    dual_screen_slide:
        - type: display
          source_display: display1
          width: 1366
          height: 768
          x: left
          anchor_x: left
        - type: display
          source_display: display2
          width: 1280
          height: 720
          x: right
          anchor_x: right
    welcome_slide:
        target: display1
        widgets:
            - type: text
              text: IF YOU SEE THIS, SOMETHING IS WRONG!
              font_size: 50
              color: red
            - type: rectangle
              width: 240
              height: 60
              x: left
              anchor_x: left
    attract_slide1:
        target: display1
        widgets:
            - type: image
              image: attract_screen1
              scale: 4
    attract_slide2:
        widgets:
            - type: image
              image: wheel
              scale: 2
    attract_slide3:
        widgets:
            - type: image
              image: fallout_new
              scale: 3
    final_score_slide:
        widgets:
            - type: text
              text: FINAL SCORE
              font_size: 42
              color: black
              y: 900
              x: 1120
              anchor_x: left
              anchor_y: top
            - type: image
              image: final_score
    base_slide:
        widgets:
            - type: text
              font_name: Wideg
              text: (player1|score)
              number_grouping: true
              min_digits: 2
              font_size: 45
              color: green
              y: 1000
              x: 600
              anchor_x: right
              anchor_y: bottom
            - type: text
              font_name: Wideg
              text: PLAYER (number)
              y: 1000
              x: 20
              font_size: 50
              color: green
              anchor_x: left
              anchor_y: bottom
            - type: text
              font_name: Wideg
              text: BALL (ball)
              color: green
              y: 900
              x: 20
              anchor_x: left
              anchor_y: bottom
              font_size: 50
            - type: image
              image: fallout_ui_clear
              z: 5
              x: right
              anchor_x: right
            - type: image
              image: pip_boy
              z: 4
              scale: 1.5
slide_player:
#    mc_ready:
#        dual_screen_slide:
#            target: combined_display
    init_done: welcome_slide
    game_ending:
        final_score_slide:
            expire: 30s



