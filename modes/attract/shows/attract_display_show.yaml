#show_version=6
##! show: attract_display_show
# MPF 0.80: slides are Godot scenes in slides/ (GMC). Shows only
# reference them by name; inline widget definitions are not allowed.
    - time: "+.3"
      slides: attract_slide1
    - time: "+5"
      slides:
        dspc_animation_slide:
          action: play
    - time: "+7"
      slides: show_final_scores
    - time: "+5"
      slides: attract_slide2
    - time: "+5"
      slides: show_high_scores
    - time: "+5"
      slides: attract_slide3
    - time: "+5"
      lights:
          caps: off
