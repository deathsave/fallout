#config_version=6

show_player:
    mode_attract_started:
        # Playfield lights. The older, slower attract_loop_show is still in
        # shows/ if you want it back (it ran at speed: 6).
        attract_light_show:
            priority: 300
            loops: -1
        attract_display_show:
            priority: 300
            loops: -1

    mode_attract_stopping:
        attract_light_show:
            action: stop

slide_player:
    mode_attract_started:
        display2_idle:
            target: display2
