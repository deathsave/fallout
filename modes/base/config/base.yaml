#config_version=6
mode:
    start_events: ball_started
    priority: 100

ball_saves:
    ball_start_ball_save:
        active_time: "+10s"
        grace_period: "+2s"
        timer_start_events: s_shooter_lane_inactive
        auto_launch: true
        balls_to_save: 1

    # Stim pack: a full med meter saves the next ball that drains (the
    # drain that would end the ball, so a multiball drain doesn't use it),
    # then the meter resets to earn another. It waits for the ball start
    # save to finish so the two never cover the same drain.
    stim_pack:
        active_time: 0          # no time limit: active until it saves a ball
        balls_to_save: 1
        only_last_ball: true
        auto_launch: true
        # Paused during VATS (which saves every drain itself) so it isn't
        # used up there; back on afterwards if the meter is still full.
        enable_events:
            - med_meter_full{not device.ball_saves.ball_start_ball_save.enabled and not mode.vats.active}
            - ball_save_ball_start_ball_save_disabled{current_player.state_machine_med_meter_status=="med5" and not mode.vats.active}
            - mode_vats_stopped{current_player.state_machine_med_meter_status=="med5" and not device.ball_saves.ball_start_ball_save.enabled}
        disable_events: ball_will_end, service_mode_entered, mode_vats_started

slide_player:
    mode_base_started:
        base_slide: {}
        # monitor 2 idles until VATS (higher priority) takes it over
        display2_idle:
            target: display2

light_player:
    ball_save_ball_start_ball_save_timer_start:
        shoot_again: lime
    ball_save_ball_start_ball_save_disabled:
        shoot_again: off
    # stim pack ready: both stim inserts lit until it saves a ball
    ball_save_stim_pack_enabled:
        stim_left: red
        stim_right: red
    ball_save_stim_pack_disabled:
        stim_left: off
        stim_right: off
    mode_base_started:
        rads: green
        meds: off
        caps: on
        vlock: off
        vend: off
        big_rad: off
        stims: off
        helmet: ffff00
        vault_boy: off
        slings: yellow
        vats: off
        crosshairs: off

    rads_level1:
        rad1: red
    rads_level2:
        rad2: red
    rads_level3:
        rad3: red
    rads_level4:
        rad4: red
    rads_level5:
        rad5: red
    rads_level6:
        rad6: red
    rads_level7:
        rad7: red
    rads_level8:
        rad8: red
    rads_level9:
        rad9: red
    rads_level10:
        rad10: red
    rads_level0:
        rads: green

    # Vault lock lights: one lit per ball in the vault, chase in multiball
    mode_base_started{device.ball_devices.bd_lock.balls==0}:
        vlock: off
    mode_base_started{device.ball_devices.bd_lock.balls==1}:
        vlock1: red
        vlock2: off
        vlock3: off
    mode_base_started{device.ball_devices.bd_lock.balls>=2}:
        vlock1: red
        vlock2: ffff00
        vlock3: off
    multiball_lock_v_lock_locked_ball{total_balls_locked==1}:
        vlock1: red
    multiball_lock_v_lock_locked_ball{total_balls_locked==2}:
        vlock2: ffff00
    multiball_vault_multiball_ended:
        vlock: off
    multiball_rads_multiball_ended{device.ball_devices.bd_lock.balls==0}:
        vlock: off
    multiball_rads_multiball_ended{device.ball_devices.bd_lock.balls==1}:
        vlock1: red
        vlock2: off
        vlock3: off
    multiball_rads_multiball_ended{device.ball_devices.bd_lock.balls>=2}:
        vlock1: red
        vlock2: ffff00
        vlock3: off
    multiball_rads_vault_multiball_ended{device.ball_devices.bd_lock.balls==0}:
        vlock: off
    multiball_rads_vault_multiball_ended{device.ball_devices.bd_lock.balls==1}:
