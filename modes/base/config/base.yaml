                    show: rad_level7_show
                    show_tokens: None
            rads8:
                show_when_active:
                    show: rad_level8_show
                    show_tokens: None
            rads9:
                show_when_active:
                    show: rad_level9_show
                    show_tokens: None
            rads10:
                show_when_active:
                    show: rad_level10_show
                    show_tokens: None
                events_when_started: rad_meter_full
                #etc
        transitions:
            - source: rads0
              target: rads1
              events: logicblock_rad_spin_sequence_complete
            - source: rads1
              target: rads2
              events: logicblock_rad_spin_sequence_complete
            - source: rads2
              target: rads3
              events: logicblock_rad_spin_sequence_complete
            - source: rads3
              target: rads4
              events: logicblock_rad_spin_sequence_complete
            - source: rads4
              target: rads5
              events: logicblock_rad_spin_sequence_complete
            - source: rads5
              target: rads6
              events: logicblock_rad_spin_sequence_complete
            - source: rads6
              target: rads7
              events: logicblock_rad_spin_sequence_complete
            - source: rads7
              target: rads8
              events: logicblock_rad_spin_sequence_complete
            - source: rads8
              target: rads9
              events: logicblock_rad_spin_sequence_complete
            - source: rads9
              target: rads10
              events: logicblock_rad_spin_sequence_complete
            - source: rads10
              target: rads0
              events: reset_rad_meter, multiball_rads_multiball_started, multiball_rads_vault_multiball_started
    med_meter_status:
        persist_state: true #so this will hold state across balls
        starting_state: med0
        states:
            med0:
                label: Start state
                show_when_active:
                    show: med_level0_show
                    show_tokens: None
            med1:
                show_when_active:
                    show: med_level1_show
                    show_tokens: None
            med2:
