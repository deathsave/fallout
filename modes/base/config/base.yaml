                    show_tokens: None
            med5:
                show_when_active:
                    show: med_level5_show
                    show_tokens: None
                events_when_started: med_meter_full
        transitions:
            - source: med0
              target: med1
              events: logicblock_med_spin_sequence_complete
            - source: med1
              target: med2
              events: logicblock_med_spin_sequence_complete
            - source: med2
              target: med3
