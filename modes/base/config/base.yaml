multiballs:
    vault_multiball:
        ball_count: 3
        ball_count_type: total
        shoot_again: 10s
        # Release the balls held in the vault. The 3rd locked ball is still
        # counted as in play, so replace it too or one ball stays locked.
        ball_locks: bd_lock
        replace_balls_in_play: true
        start_events: multiball_lock_v_lock_full

    # Rads multiball: 3 balls when the rad meter fills. Served from the
    # trough; only if the trough is short are balls taken from the vault
    # (MPF always empties ball_locks first, hence the two variants).
    rads_multiball:
        ball_count: 3
        ball_count_type: total
        shoot_again: 10s
        start_events: rad_meter_full{device.ball_devices.bd_trough.balls>=2}
    rads_vault_multiball:
        ball_count: 3
        ball_count_type: total
        shoot_again: 10s
        ball_locks: bd_lock
        start_events: rad_meter_full{device.ball_devices.bd_trough.balls<2}

multiball_locks:
    v_lock:
        balls_to_lock: 3
        lock_devices: bd_lock
        # Count the balls physically in the vault, so locks carry over from
        # ball to ball (and player to player).
        locked_ball_counting_strategy: physical_only
        # Only 3 balls in the machine: replace the first 2 locked balls with
        # new ones from the trough; the 3rd lock starts the multiball.
        balls_to_replace: 2
        # Off during the multiball (balls entering the vault are kicked
        # back out), back on for the next one.
        enable_events: mode_base_started, multiball_vault_multiball_ended, multiball_rads_multiball_ended, multiball_rads_vault_multiball_ended
        disable_events: multiball_lock_v_lock_full, multiball_rads_multiball_started, multiball_rads_vault_multiball_started

