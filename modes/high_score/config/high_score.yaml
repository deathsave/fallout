#config_version=6
##! mode: high_score

mode:
  priority: 500
  start_events: game_ending, start_high_score
  use_wait_queue: true
high_score:
  _overwrite: true
  enter_initials_timeout: 90
  award_slide_display_time: 6s
  # define your high score categories and the awards
  categories: !!omap
    - score:
        - GRAND CHAMPION
        - HIGH SCORE 1
        - HIGH SCORE 2
        - HIGH SCORE 3
        - HIGH SCORE 4
        - HIGH SCORE 5
        - HIGH SCORE 6
        - HIGH SCORE 7
        - HIGH SCORE 8
  # set the defaults
  defaults:
    score:
      - ROGERSHARP: 1000000
      - GEORGEG: 800000
      - KEITHELWIN: 600000
      - JACKDANGER: 500000
      - HWILLIAMS: 400000
      - SAMSTERN: 300000
      - SDANESI: 200000
      - SRITCHIE: 100000
      - 5PENNY: 50000
# MPF 0.80: the built-in high_score / high_score_award GMC slides are used.
