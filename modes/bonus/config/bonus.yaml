#config_version=6
mode_settings:
    display_delay_ms: 2000
    bonus_entries:
    - event: bonus_caps
      score: (current_player.slurm_caps_total * 25 * (1 + current_player.fry_level))
    - event: bonus_hypnotoad_saves
      score: (current_player.hypnotoad_saves * 250)
    - event: bonus_dark_matter
      score: (current_player.dark_matter * 200 * (1 + current_player.nibbler_level))

slide_player:
    mode_bonus_started: bonus_start_slide
    bonus_caps: slurm_bonus
    bonus_hypnotoad_saves: hypnotoad_bonus
    bonus_dark_matter: dark_matter_bonus
    bonus_total: bonus_total_slide
