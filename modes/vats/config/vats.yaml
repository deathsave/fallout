#config_version=6
##! mode: vats
#
# V.A.T.S. - knock down all four V-A-T-S drop targets to start a crosshair
# hunt. One of the seven crosshair shots is lit at random, with 30 seconds
# to hit it. A hit scores, resets the timer to 30 and lights a different
# crosshair. Four hits complete VATS for 200,000; letting the timer run out
# ends it. The drop targets reset when it ends either way.
# Every drain is saved while VATS runs.

mode:
    start_events: drop_target_bank_vats_down
    stop_events: timer_vats_timer_complete, vats_shots_hit_complete
    priority: 200

# Saves every drain for as long as VATS runs (switches off when the mode
# ends). The stim pack is paused meanwhile - see stim_pack in base.yaml.
ball_saves:
    vats_ball_save:
        active_time: 0          # no time limit: the mode ending disables it
        balls_to_save: -1       # unlimited
        auto_launch: true

light_player:
    ball_save_vats_ball_save_enabled:
        shoot_again: lime

timers:
    vats_timer:
        start_value: 30
        end_value: 0
        direction: down
        start_running: true
        bcp: true
        control_events:
            - event: vats_shots_hit     # each hit buys a fresh 30 seconds
              action: restart

# Only the lit (enabled) shot counts; it shows its crosshair red.
shot_profiles:
    vats_target:
        states:
            - name: lit
              show: vats_crosshair
        advance_on_hit: false
        show_when_disabled: false

# One shot per crosshair insert (see the map in config/common.yaml)
shots:
    vats_left_spinner:
        switch: s_lspinner
        profile: vats_target
        start_enabled: false
        enable_events: vats_light_cross1
        show_tokens:
            crosshair: cross1
    vats_left_ramp:
        switch: s_left_ramp
        profile: vats_target
        start_enabled: false
        enable_events: vats_light_cross2
        show_tokens:
            crosshair: cross2
    vats_vault_lock:
        hit_events: balldevice_bd_lock_ball_entered
        profile: vats_target
        start_enabled: false
        enable_events: vats_light_cross3
        show_tokens:
            crosshair: cross3
    vats_center:
        switch: s_center_ramp     # the center spinner doesn't count
        profile: vats_target
        start_enabled: false
        enable_events: vats_light_cross4
        show_tokens:
            crosshair: cross4
    vats_scoop:
        switch: s_scoop
        profile: vats_target
        start_enabled: false
        enable_events: vats_light_cross5
        show_tokens:
            crosshair: cross5
    vats_right_ramp:
        switch: s_right_ramp
        profile: vats_target
        start_enabled: false
        enable_events: vats_light_cross6
        show_tokens:
            crosshair: cross6
    vats_right_spinner:
        switch: s_rspinner
        profile: vats_target
        start_enabled: false
        enable_events: vats_light_cross7
        show_tokens:
            crosshair: cross7

shot_groups:
    vats_shots:
        shots: vats_left_spinner, vats_left_ramp, vats_vault_lock, vats_center,
            vats_scoop, vats_right_ramp, vats_right_spinner
        disable_events: vats_shots_hit  # the hit crosshair goes out

# Lights the first crosshair, then a different one after every hit
event_player:
    mode_vats_started: vats_pick_crosshair
    vats_shots_hit: vats_pick_crosshair

random_event_player:
    vats_pick_crosshair:
        events:
            - vats_light_cross1
            - vats_light_cross2
            - vats_light_cross3
            - vats_light_cross4
            - vats_light_cross5
            - vats_light_cross6
            - vats_light_cross7
        force_different: true   # never the same crosshair twice in a row
        force_all: false

counters:
    vats_hit_count:
        count_events: vats_shots_hit
        count_complete_value: 4
        events_when_complete: vats_shots_hit_complete

variable_player:
    mode_vats_started:
        vats_hits:
            action: set
            int: 0
    vats_shots_hit:
        score: 10000
        vats_hits: 1
    vats_shots_hit_complete:
        score: 200000

slide_player:
    # on the second monitor; the score stays on monitor 1
    mode_vats_started:
        vats_slide:
            target: display2

sound_player:
    mode_vats_started:
        voicy_quest_start:
            action: play
            bus: voice
    vats_shots_hit:
        objective:
            action: play
            bus: sfx
    # (completion sound is in base mode: this mode stops on that event)

show_player:
    mode_vats_started:
        vats_helmet_show:
            action: play
            loops: -1
    vats_shots_hit:
        vats_hit_flash:
            action: play
            loops: 0

shows:
    vats_crosshair:
        - lights:
              (crosshair): red
    # Pip-Boy green sweep across the power armor helmet while VATS runs
    vats_helmet_show:
        - duration: 100ms
          lights:
              power1: lime
              powers: off
              power3: off
              power4: off
              power5: off
              power6: off
              power7: off
              power8: off
              power9: off
        - duration: 100ms
          lights:
              power1: off
              powers: lime
        - duration: 100ms
          lights:
              powers: off
              power3: lime
        - duration: 100ms
          lights:
              power3: off
              power4: lime
        - duration: 100ms
          lights:
              power4: off
              power5: lime
        - duration: 100ms
          lights:
              power5: off
              power6: lime
        - duration: 100ms
          lights:
              power6: off
              power7: lime
        - duration: 100ms
          lights:
              power7: off
              power8: lime
        - duration: 100ms
          lights:
              power8: off
              power9: lime
    vats_hit_flash:
        - duration: 100ms
          lights:
              vault_boy: lime
        - duration: 100ms
          lights:
              vault_boy: off
        - duration: 100ms
          lights:
              vault_boy: lime
        - duration: 100ms
          lights:
              vault_boy: off
