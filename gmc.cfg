; GMC (Godot Media Controller) config for MPF 0.80.
; Replaces the old mpf-mc keyboard:, sound_system: and kivy_config: sections.

[gmc]
exit_on_esc=true

[keyboard]
; key = ["switch", switch_name]  (hold key = switch active)
s=["switch", "s_start"]
z=["switch", "s_left_flipper"]
slash=["switch", "s_right_flipper"]
1=["switch", "s_trough1"]
2=["switch", "s_trough2"]
3=["switch", "s_trough3"]
l=["switch", "s_shooter_lane"]
; VATS drop targets (toggle: press to drop, press again to raise)
v=["switch", "s_vats1", "toggle"]
b=["switch", "s_vats2", "toggle"]
n=["switch", "s_vats3", "toggle"]

[sound_system]
; Bus names must match default_bus_layout.tres
music={"type": "solo"}
voice={"type": "simultaneous", "simultaneous_sounds": 1}
sfx={"type": "simultaneous", "simultaneous_sounds": 8, "default": true, "duck_default": true}
